name: Lint & Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install -e . --no-deps

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      # Scoped to src/ to match ci.yml and quality.yml. This step previously
      # ran `mypy src/ tests/` under [tool.mypy] strict, which reports 156
      # errors — almost all missing annotations in tests/ — so this workflow
      # failed on every push to main and its dependent jobs (test-quality,
      # docker-build, security-scan) never ran at all. That typing debt is now
      # reported per-run by the advisory `typecheck-tests` job in
      # merge-gate.yml, where the count is visible instead of being one more
      # red X nobody can distinguish from a real regression.
      - name: Type check with mypy
        # Match ci.yml / quality.yml. Strict mypy over tests/ is not green
        # (150+ errors, mostly no-untyped-def) and is out of scope for this job.
        run: |
          mypy src/rif_runtime --ignore-missing-imports

      - name: Security check with Bandit
        run: |
          bandit -r src/ -ll -f json -o bandit-report.json; BANDIT_EXIT=$?
          python -m json.tool bandit-report.json
          exit $BANDIT_EXIT

      # Dependency auditing moved to the `dependency-security` job in
      # merge-gate.yml, where it runs against the hash-pinned locks and is
      # allowed to fail the build. The `|| true` form here could only ever
      # produce a green check, and pip-audit was not even installed in this
      # job, so it reported nothing at all.

      - name: Check for unused imports
        run: |
          pip install autoflake
          # Class bodies that are only a docstring still need `pass` under some
          # styles; ignore those so autoflake does not false-positive.
          autoflake --recursive --check --ignore-pass-after-docstring src/ tests/

      - name: Check docstring coverage
        run: |
          interrogate -vv src/ -m 60 -p -I -n -s || true

  test-quality:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install -e . --no-deps

      - name: Run tests with coverage
        run: |
          pytest --cov=src/rif_runtime --cov-report=json --cov-report=term tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.json
          flags: unittests
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          coverage json
          python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
              pct = data['totals']['percent_covered']
              if pct < 80:
                  exit(1)
          print(f'Coverage: {pct}%')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: rif-runtime-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
