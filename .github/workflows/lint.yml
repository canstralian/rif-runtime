name: Lint & Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with mypy
        # Scoped to src/ with --ignore-missing-imports so this agrees with
        # ci.yml and quality.yml. Checking tests/ under strict mode reports 156
        # errors on main today (94 no-untyped-def, 45 no-untyped-call, the rest
        # annotation noise) — none of them real defects, but enough to keep this
        # job permanently red. --ignore-missing-imports covers networkx, which
        # ships no stubs.
        run: |
          mypy src/ --ignore-missing-imports

      - name: Security check with Bandit
        run: |
          bandit -r src/ -ll -f json -o bandit-report.json || true
          cat bandit-report.json | python -m json.tool

      - name: Audit dependencies
        run: |
          pip-audit --desc || true

      - name: Check for unused imports
        run: |
          pip install autoflake
          autoflake --recursive --check src/ tests/

      - name: Check docstring coverage
        run: |
          pip install interrogate
          interrogate -vv src/ -m 60 -p -I -n -s || true

  test-quality:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=src/rif_runtime --cov-report=json --cov-report=term tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.json
          flags: unittests
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          coverage json
          python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
              pct = data['totals']['percent_covered']
              if pct < 80:
                  exit(1)
          print(f'Coverage: {pct}%')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: rif-runtime-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif
