name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ruff-mypy-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          # Keyed on the compiled lock rather than the default, which hashes
          # files holding version ranges and so never changes when upstream
          # does. See requirements/README.md.
          cache-dependency-path: requirements/dev.txt

      # The ruff version is no longer pinned inline here. It was pinned to stop
      # unpinned installs pulling 0.16.x and turning main red, but that pin
      # disagreed with requirements-dev.txt's `ruff>=0.12,<0.13`, so this job
      # and ci.yml linted with different ruff majors. Both now install the same
      # hash-pinned lock, which is the only place a version is chosen.
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install -e . --no-deps

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/rif_runtime --ignore-missing-imports
      - run: pytest
