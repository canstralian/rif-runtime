name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Keyed on the compiled lock, not pyproject.toml/requirements.txt:
          # those hold version ranges, so their hash stays put while the wheels
          # they resolve to move. Keying on the lock makes a cache hit and a
          # cache miss install the same bytes.
          cache-dependency-path: requirements/dev.txt
      # --require-hashes rejects any artefact whose digest is not in the lock.
      # An editable install cannot be hashed, so the project goes in separately
      # with --no-deps; its dependencies are already pinned by the line above.
      # The pip upgrade matches every other lock-installing job in this repo —
      # this was the one workflow without it.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      # pip install -e . must precede pytest: test_version.py asserts that
      # importlib.metadata.version("rif-runtime") matches pyproject.toml.
      - run: python -m pip install -e . --no-deps
      - run: ruff check src tests
      - run: mypy src/rif_runtime --ignore-missing-imports
      - run: pytest -q
