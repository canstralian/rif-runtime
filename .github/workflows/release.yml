name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install -e . --no-deps

      # The assertion that makes this a release gate rather than a merge gate:
      # the tag being built must name the version the package actually
      # declares. Without it a v0.4.0 tag can ship a 0.3.0 artefact.
      - name: Assert tag matches package version
        run: |
          version="$(python -c 'import importlib.metadata as m; print(m.version("rif-runtime"))')"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=${tag} package=${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Verify
        run: |
          ruff check src tests
          mypy src/rif_runtime --ignore-missing-imports
          pytest -q
          rif replay

      - name: Build
        run: python -m build

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Mark release-candidate tags (e.g. v0.3.0rc1) so they don't publish as GA.
          prerelease: ${{ contains(github.ref_name, 'rc') }}
