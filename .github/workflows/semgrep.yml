name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: semgrep-security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pin to full commit SHAs so p/github-actions mutable-tag rules do not
      # flag this workflow, and so tags cannot be silently retargeted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      # Use the CLI (not semgrep/semgrep-action@v1): that action rejects
      # generateSarif and does not emit semgrep.sarif for upload.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/github-actions \
            --sarif \
            --output=semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
