app = "rif-runtime"
primary_region = "iad"

[build]

[env]
  RIF_SERVER_HOST = "0.0.0.0"
  RIF_SERVER_PORT = "8000"
  RIF_DATA_DIR = "data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "rif_data"
  destination = "/app/data"
  initial_size = "1gb"
