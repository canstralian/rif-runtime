[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rif-runtime"
version = "0.3.0rc1"
description = "Governed execution substrate for intelligent systems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Stephen de Jager" }
]
keywords = [
    "ai",
    "runtime",
    "governance",
    "policy",
    "evidence",
    "replay",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pyyaml",
    "networkx",
    "typer",
    "rich",
    "httpx",
    "cryptography",
]

[project.optional-dependencies]
supabase = [
    "supabase>=2.0,<3.0",
]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2,<8.0",
    "mypy>=1.18",
    "ruff>=0.12",
    # Required by tests/test_rif_familiar_contracts.py. Without these the
    # quality.yml `pip install -e ".[dev]"` path collects an ImportError even
    # though ci.yml (which installs requirements-dev.txt) passes.
    "jsonschema[format]>=4.25,<5.0",
    "rfc3339-validator>=0.1.4,<0.2",
    # PyYAML ships no py.typed. mypy 1.x reports import-untyped for it even
    # under --ignore-missing-imports (2.x silences it), so ci.yml fails without
    # this while quality.yml passes.
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
rif = "rif_runtime.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# Vercel FastAPI builder looks for app in default locations; src/ layout needs
# an explicit entrypoint (see https://vercel.com/docs/frameworks/backend/fastapi).
[tool.vercel]
entrypoint = "src.rif_runtime.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
show_error_codes = true
pretty = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
